name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # lint + typecheck + build + test 统一检查(M0 验收,docs/11-roadmap.md)
      - run: bun run check
      # openai import 第二道防线(ESLint 之外的机械 grep,docs/02-architecture.md 第 8 节)
      - name: openai import boundary (second line of defense)
        run: |
          ! grep -rn "from ['\"]openai" src --include='*.ts' | grep -v providers/openai-chat
